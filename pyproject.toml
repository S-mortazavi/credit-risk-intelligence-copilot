[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-intelligence-copilot"
version = "0.1.0"
description = "An AI-powered credit risk analysis and explainability copilot."
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "shap",
    "matplotlib",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]